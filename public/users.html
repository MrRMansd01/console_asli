<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت کاربران</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="منو">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div id="app-layout" class="app-layout">
        <aside id="app-sidebar" class="sidebar-shell"></aside>
        <main class="page-shell">
            <div class="page-shell-inner">
                <header class="page-header">
                    <h1 class="page-title">مدیریت کاربران</h1>
                    <div class="page-header-actions">
                        <button id="add-user-btn" class="btn btn-primary">
                            <i class="fas fa-plus"></i> افزودن کاربر جدید
                        </button>
                    </div>
                </header>

                <section class="panel">
                    <div class="table-container">
                        <table id="users-table">
                            <thead>
                                <tr>
                                    <th>نام</th>
                                    <th>ایمیل</th>
                                    <th>نقش</th>
                                    <th>مدرسه</th>
                                    <th>کلاس</th>
                                    <th>عملیات</th>
                                </tr>
                            </thead>
                            <tbody>
                                </tbody>
                        </table>
                        <p id="loading-message">در حال بارگذاری کاربران...</p>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div id="user-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">ویرایش کاربر</h2>
            <form id="user-form">
                <input type="hidden" id="user-id">
                <div class="form-group">
                    <label for="user-name">نام:</label>
                    <input type="text" id="user-name" required>
                </div>
                <div class="form-group">
                    <label for="user-email">ایمیل (غیرقابل ویرایش):</label>
                    <input type="email" id="user-email" disabled>
                </div>
                <div class="form-group">
                    <label for="user-role">نقش:</label>
                    <select id="user-role" required>
                        <option value="student">دانش‌آموز</option>
                        <option value="teacher">معلم</option>
                        <option value="consultant">مشاور</option>
                        <option value="admin">مدیر</option>
                        <option value="super_admin">ادمین کل</option>
                    </select>
                </div>
                
                <div id="admin-fields" style="display: none;">
                    <div class="form-group">
                        <label for="school-name">نام مدرسه:</label>
                        <input type="text" id="school-name" placeholder="نام مدرسه مدیر را وارد کنید">
                    </div>
                    <div class="form-group">
                        <label for="student-limit">محدودیت دانش‌آموز:</label>
                        <input type="number" id="student-limit" placeholder="تعداد مجاز دانش‌آموز">
                    </div>
                </div>
                
                <div id="manager-fields" style="display: none;">
                    <div class="form-group">
                        <label for="manager-select">مدیر مدرسه (برای تخصیص به مدرسه):</label>
                        <select id="manager-select">
                            <option value="">بدون مدیر (مستقل)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" id="class-assignment-fields" style="display: none;">
                    <label for="user-class-select">تخصیص کلاس:</label>
                    <select id="user-class-select">
                        <option value="">بدون کلاس</option>
                        </select>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">ذخیره تغییرات</button>
                    <button type="button" id="cancel-btn" class="btn btn-secondary">انصراف</button>
                </div>
            </form>
        </div>
    </div>

    <div id="add-user-modal" class="modal">
        <div class="modal-content">
            <h2>افزودن کاربر جدید</h2>
            <form id="add-user-form">
                <div class="form-group">
                    <label for="new-user-name">نام کامل:</label>
                    <input type="text" id="new-user-name" required>
                </div>
                <div class="form-group">
                    <label for="new-user-email">ایمیل (برای ورود):</label>
                    <input type="email" id="new-user-email" required>
                </div>
                <div class="form-group">
                    <label for="new-user-password">رمز عبور:</label>
                    <input type="password" id="new-user-password" required>
                </div>
                <div class="form-group">
                    <label for="new-user-role">نقش:</label>
                    <select id="new-user-role" required>
                        <option value="student">دانش‌آموز</option>
                        <option value="teacher">معلم</option>
                        <option value="consultant">مشاور</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">ایجاد کاربر</button>
                    <button type="button" id="cancel-add-btn" class="btn btn-secondary">انصراف</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth-check.js"></script>
    <script src="js/users.js"></script>
</body>
</html>
