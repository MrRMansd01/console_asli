<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت اشتراک‌ها</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="منو">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div id="app-layout" class="app-layout">
        <aside id="app-sidebar" class="sidebar-shell"></aside>
        <main class="page-shell">
            <div class="page-shell-inner">
                <header class="page-header">
                    <h1 class="page-title">مدیریت اشتراک مدیران</h1>
                    <div class="page-header-actions"></div>
                </header>

                <section class="panel">
                    <form id="subscription-form">
                        <div class="form-group">
                            <label for="admin-select">۱. ابتدا مدیر مدرسه را انتخاب کنید:</label>
                            <select id="admin-select" required>
                                <option value="">انتخاب کنید...</option>
                                <!-- Admin users will be dynamically inserted here -->
                            </select>
                        </div>

                        <div id="subscription-details" style="display: none;">
                            <p>تاریخ انقضای فعلی: <strong id="current-expiry">--</strong></p>
                            <div class="form-group">
                                <label for="expiry-date">۲. تاریخ انقضای جدید را تعیین کنید:</label>
                                <input type="text" id="expiry-date" required placeholder="تاریخ جدید را انتخاب کنید">
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> ذخیره تاریخ انقضا
                                </button>
                            </div>
                        </div>
                        <p id="loading-message">لطفا یک مدیر را انتخاب کنید.</p>
                    </form>
                </section>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/fa.js"></script>
    <script src="js/auth-check.js"></script>
    <script src="js/subscriptions.js"></script>
</body>
</html>
