<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به کنسول پایه</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-bg: #0f172a;
            --color-surface: #111827;
            --color-border: rgba(148, 163, 184, 0.28);
            --color-border-strong: rgba(148, 163, 184, 0.45);
            --color-text: #e5e7eb;
            --color-text-soft: #9ca3af;
            --color-text-muted: #64748b;
            --color-primary: #10b981;
            --color-primary-strong: #059669;
            --color-success: #22c55e;
            --color-danger: #f87171;
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 18px;
            --shadow-soft: 0 10px 40px rgba(2, 6, 23, 0.55);
            --transition-speed: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, rgba(16, 185, 129, 0.16), transparent 55%),
                radial-gradient(circle at bottom right, rgba(56, 189, 248, 0.16), transparent 55%),
                var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 90%;
            max-width: 480px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            padding: 2.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: none;
        }

        .login-logo {
            color: var(--color-primary);
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            position: relative;
            display: inline-block;
        }

        .login-logo::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background-color: var(--color-primary);
            border-radius: 3px;
        }

        .login-tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--color-border);
        }

        .tab {
            flex: 1;
            padding: 1rem 0;
            cursor: pointer;
            position: relative;
            transition: var(--transition-speed);
            font-weight: 500;
            color: var(--color-text-soft);
        }

        .tab.active {
            color: var(--color-primary);
            font-weight: bold;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--color-primary);
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: right;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--color-text-soft);
            transition: var(--transition-speed);
        }

        .form-control {
            width: 100%;
            padding: 1rem;
            border: 1px solid var(--color-border-strong);
            border-radius: 12px;
            font-size: 1rem;
            transition: var(--transition-speed);
            background-color: rgba(15, 23, 42, 0.9);
            color: var(--color-text);
        }

        .form-control::placeholder {
            color: var(--color-text-muted);
        }

        .form-control:focus {
            border-color: rgba(34, 197, 94, 0.7);
            outline: none;
            box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.2);
            background-color: rgba(15, 23, 42, 0.9);
        }

        .auth-btn {
            width: 100%;
            padding: 1.1rem;
            background: linear-gradient(120deg, #22c55e, #0f766e);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-speed);
            margin-top: 1.5rem;
            box-shadow: var(--shadow-soft);
        }

        .auth-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(2, 6, 23, 0.6);
        }

        .auth-btn:active {
            transform: translateY(-1px);
        }

        .login-footer {
            margin-top: 2rem;
            color: var(--color-text-muted);
            font-size: 0.9rem;
        }

        .forgot-password {
            color: var(--color-primary);
            text-decoration: none;
            margin-top: 1rem;
            display: inline-block;
            transition: var(--transition-speed);
            font-weight: 500;
        }

        .forgot-password:hover {
            color: var(--color-primary-strong);
            text-decoration: underline;
        }

        .message-container {
            margin: 15px 0;
            padding: 0;
            border-radius: 8px;
            display: none;
        }

        .message {
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(2, 6, 23, 0.35);
            position: relative;
            padding-right: 35px;
        }

        .message.error {
            background-color: rgba(248, 113, 113, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.4);
            color: #fecaca;
        }

        .message.success {
            background-color: rgba(34, 197, 94, 0.12);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #bbf7d0;
        }

        .message::before {
            content: '!';
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        .message.error::before {
            background-color: rgba(248, 113, 113, 0.9);
            color: #ffffff;
        }

        .message.success::before {
            background-color: rgba(34, 197, 94, 0.9);
            color: #ffffff;
            content: '✓';
        }

        .form-tab {
            display: none;
        }

        .form-tab.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
                width: 95%;
            }

            .login-logo {
                font-size: 1.8rem;
            }

            .form-control {
                padding: 0.9rem;
            }

            .auth-btn {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">
            کنسول پایه
        </div>
        
        <div class="login-tabs">
            <div class="tab active" id="login-tab">ورود</div>
            <div class="tab" id="register-tab">ثبت نام</div>
        </div>
        
        <div class="message-container" id="message-container">
            </div>
        
        <div class="form-tab active" id="login-form">
            <form id="login-form-element">
                <div class="form-group">
                    <label for="login-name">ایمیل</label>
                    <input type="email" id="login-name" name="name" class="form-control" placeholder="ایمیل خود را وارد کنید" required>
                </div>
                
                <div class="form-group">
                    <label for="login-password">رمز عبور</label>
                    <input type="password" id="login-password" name="password" class="form-control" placeholder="رمز عبور خود را وارد کنید" required>
                </div>
                
                <button type="submit" class="auth-btn">ورود به سیستم</button>
            </form>
            
            <a href="#" class="forgot-password">رمز عبور خود را فراموش کرده‌اید؟</a>
        </div>
        
        <div class="form-tab" id="register-form">
            <form id="register-form-element">
                <div class="form-group">
                    <label for="register-name">نام کاربری</label>
                    <input type="text" id="register-name" name="name" class="form-control" placeholder="یک نام کاربری انتخاب کنید" required>
                </div>
                
                <div class="form-group">
                    <label for="name">نام</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="نام خود را وارد کنید" required>
                </div>
                
                <div class="form-group">
                    <label for="register-email">ایمیل</label>
                    <input type="email" id="register-email" name="email" class="form-control" placeholder="ایمیل خود را وارد کنید" required>
                </div>
                
                <div class="form-group">
                    <label for="register-password">رمز عبور</label>
                    <input type="password" id="register-password" name="password" class="form-control" placeholder="یک رمز عبور انتخاب کنید" required>
                </div>
                
                <button type="submit" class="auth-btn">ثبت نام</button>
            </form>
            
            <div class="login-footer">
                با ثبت نام، شما <a href="#" class="forgot-password">قوانین و مقررات</a> سایت را می‌پذیرید.
            </div>
        </div>
    </div>

    <script>
        // اتصال سوپربیس از سرور (از .env خوانده می‌شود؛ امن‌تر از قرار دادن کلید در کد)
        let supabaseClient;
        (async function initSupabase() {
            try {
                const res = await fetch('/api/supabase-config');
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    document.getElementById('message-container').innerHTML = '<div class="message error">تنظیمات سوپربیس یافت نشد. فایل .env را در ریشه پروژه بررسی کنید.</div>';
                    document.getElementById('message-container').style.display = 'block';
                    return;
                }
                const { url, anonKey } = await res.json();
                supabaseClient = window.supabase.createClient(url, anonKey);
                runAfterReady();
            } catch (e) {
                console.error('Supabase init error:', e);
                document.getElementById('message-container').innerHTML = '<div class="message error">خطا در اتصال به سوپربیس. سرور کنسول و فایل .env را بررسی کنید.</div>';
                document.getElementById('message-container').style.display = 'block';
            }
        })();

        function runAfterReady() {
            if (!supabaseClient) return;

        // Toggle between login and register tabs
        document.getElementById('login-tab').addEventListener('click', () => {
            document.getElementById('login-tab').classList.add('active');
            document.getElementById('register-tab').classList.remove('active');
            document.getElementById('login-form').classList.add('active');
            document.getElementById('register-form').classList.remove('active');
            hideMessages();
        });
        
        document.getElementById('register-tab').addEventListener('click', () => {
            document.getElementById('register-tab').classList.add('active');
            document.getElementById('login-tab').classList.remove('active');
            document.getElementById('register-form').classList.add('active');
            document.getElementById('login-form').classList.remove('active');
            hideMessages();
        });
        
        // Show message function
        function showMessage(message, type) {
            const messageContainer = document.getElementById('message-container');
            messageContainer.style.display = 'block';
            messageContainer.innerHTML = `<div class="message ${type}">${message}</div>`;
        }
        
        // Hide messages
        function hideMessages() {
            document.getElementById('message-container').style.display = 'none';
        }
        
        // Get URL parameter function
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function applyUrlParamsAndDemo() {
            const error = getUrlParameter('error');
            if (error) {
                let errorMessage = '';
                switch(error) {
                    case 'invalid_credentials':
                        errorMessage = 'نام کاربری یا رمز عبور اشتباه است.';
                        break;
                    case 'user_exists':
                        errorMessage = 'این نام کاربری قبلاً ثبت شده است.';
                        document.getElementById('register-tab').click();
                        break;
                    case 'empty_fields':
                        errorMessage = 'لطفا تمام فیلدها را پر کنید.';
                        break;
                    case 'server':
                        errorMessage = 'خطا در سرور. لطفا دوباره تلاش کنید.';
                        break;
                    default:
                        errorMessage = 'خطایی رخ داده است. لطفا دوباره تلاش کنید.';
                }
                showMessage(errorMessage, 'error');
            }

            const success = getUrlParameter('success');
            if (success) {
                showMessage('عملیات با موفقیت انجام شد.', 'success');
            }

            const demoEmail = getUrlParameter('demo_email');
            const demoPassword = getUrlParameter('demo_password');
            if (demoEmail) document.getElementById('login-name').value = demoEmail;
            if (demoPassword) document.getElementById('login-password').value = demoPassword;
            if (demoEmail && demoPassword) document.getElementById('login-form-element').requestSubmit();
        }

        // Handle login form submission
        document.getElementById('login-form-element').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('login-name').value;
            const password = document.getElementById('login-password').value;
            
            if (!name || !password) {
                showMessage('لطفا ایمیل و رمز عبور را وارد کنید.', 'error');
                return;
            }
            
            try {
                console.log('Attempting login with:', { email: name });
                
                // Sign in with Supabase
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: name,
                    password: password
                });
                
                if (error) {
                    console.error('Supabase login error:', error);
                    throw error;
                }
                
                console.log('Login successful:', data);
                window.location.href = '/home.html'; // <<<< این خط را تغییر دهید
                // Redirect to main page on successful login
            } catch (error) {
                console.error('Login error:', error);
                
                // Show more detailed error message
                let errorMsg = 'خطا در ورود: ';
                if (error.message.includes('Invalid login credentials')) {
                    errorMsg = 'ایمیل یا رمز عبور اشتباه است.';
                } else {
                    errorMsg += error.message;
                }
                
                showMessage(errorMsg, 'error');
            }
        });

        // Handle register form submission
        document.getElementById('register-form-element').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;
            
            if (!name || !email || !password) {
                showMessage('لطفا تمام فیلدها را پر کنید.', 'error');
                return;
            }
            
            try {
                console.log('Attempting registration with:', { email, name });
                
                // Sign up with Supabase
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            name: name
                        }
                    }
                });
                
                if (error) {
                    console.error('Supabase signup error:', error);
                    throw error;
                }
                
                console.log('Registration successful:', data);
                
                // Check if user table exists before inserting
                try {
                    // Create user profile in profiles table
                    const { error: profileError } = await supabaseClient
                        .from('profiles')
                        .insert([
                            { 
                                id: data.user.id,
                                name: name,
                                email: email,
                                created_at: new Date().toISOString(),
                                updated_at: new Date().toISOString()
                            }
                        ]);
                    
                    if (profileError) {
                        console.error('Profile creation error:', profileError);
                        console.log('Profile error details:', profileError.details, profileError.hint, profileError.message);
                        // Continue even if profile creation fails
                        console.log('Continuing despite profile error');
                    } else {
                        console.log('Profile created successfully');
                    }
                } catch (profileCreationError) {
                    console.error('Error creating profile:', profileCreationError);
                    // Continue even if profile creation fails
                }
                
                showMessage('ثبت‌نام با موفقیت انجام شد. لطفا وارد شوید.', 'success');
                
                // Switch to login tab
                setTimeout(() => {
                    document.getElementById('login-tab').click();
                }, 2000);
                
            } catch (error) {
                console.error('Registration error:', error);
                
                // Show more detailed error message
                let errorMsg = 'خطا در ثبت‌نام: ';
                if (error.message.includes('User already registered')) {
                    errorMsg = 'این ایمیل قبلاً ثبت شده است.';
                } else if (error.message.includes('Password should be at least')) {
                    errorMsg = 'رمز عبور باید حداقل ۶ کاراکتر باشد.';
                } else if (error.message.includes('Email not confirmed')) {
                    errorMsg = 'ایمیل تایید نشده است. لطفا ایمیل خود را بررسی کنید.';
                } else {
                    errorMsg += error.message;
                }
                
                showMessage(errorMsg, 'error');
            }
        });

            applyUrlParamsAndDemo();
        } // end runAfterReady
    </script>
</body>
</html>
