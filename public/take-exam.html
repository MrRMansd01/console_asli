<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شرکت در آزمون</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .exam-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background-color: var(--color-surface-2); border-radius: var(--radius-md); margin-bottom: 2rem; }
        .timer { font-size: 1.5rem; font-weight: bold; color: var(--primary-color); }
        .question-block { margin-bottom: 2rem; border-bottom: 1px solid var(--color-border); padding-bottom: 1.5rem; }
        .question-text { font-size: 1.2rem; font-weight: 500; margin-bottom: 1rem; }
        .question-image, .option-image { max-width: 100%; max-height: 200px; border-radius: var(--radius-md); margin-top: 1rem; }
        .options { display: flex; flex-direction: column; gap: 0.8rem; }
        .option { display: flex; align-items: center; gap: 10px; padding: 0.8rem; border-radius: var(--radius-md); border: 1px solid var(--color-border); cursor: pointer; }
        .option:hover { background-color: rgba(148, 163, 184, 0.1); }
        .option input[type="radio"] { margin-left: 10px; }
        .option label { flex-grow: 1; }
    </style>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="منو">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div id="app-layout" class="app-layout">
        <aside id="app-sidebar" class="sidebar-shell"></aside>
        <main class="page-shell">
            <div class="page-shell-inner">
                <header class="page-header">
                    <h1 id="exam-title" class="page-title">شرکت در آزمون</h1>
                    <div class="page-header-actions"></div>
                </header>

                <section class="panel">
                    <div id="exam-area">
                        <div class="exam-header">
                            <h2 id="exam-name-display">نام آزمون</h2>
                            <div id="timer" class="timer">--:--</div>
                        </div>
                        <div id="questions-container">
                            <!-- Questions will be loaded here -->
                        </div>
                        <div class="toolbar" style="text-align: center; margin-top: 2rem;">
                            <button id="submit-exam-btn" class="btn btn-primary" style="display: none;">
                                <i class="fas fa-check-circle"></i> ثبت نهایی و مشاهده نتیجه
                            </button>
                        </div>
                         <p id="loading-message">در حال آماده‌سازی آزمون...</p>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth-check.js"></script>
    <script src="js/take-exam.js"></script>
</body>
</html>
