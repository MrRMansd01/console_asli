<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت کلاس‌ها</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <style>
        .table-wrapper { max-height: 250px; overflow-y: auto; margin-top: 1rem; }
        .modal-content.large { max-width: 800px; }
    </style>
</head>
<body>
    <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="منو">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div id="app-layout" class="app-layout">
        <aside id="app-sidebar" class="sidebar-shell"></aside>
        <main class="page-shell">
            <div class="page-shell-inner">
                <header class="page-header">
                    <h1 class="page-title">مدیریت کلاس‌ها</h1>
                </header>

                <section class="panel">
                    <div class="toolbar">
                        <button id="add-class-btn" class="btn btn-primary">
                            <i class="fas fa-plus"></i> افزودن کلاس جدید
                        </button>
                    </div>
                    <div class="table-container">
                        <table id="classes-table">
                            <thead>
                                <tr>
                                    <th>نام کلاس</th>
                                    <th>پایه تحصیلی</th>
                                    <th>تعداد دانش‌آموزان</th>
                                    <th>عملیات</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Class rows will be dynamically inserted here -->
                            </tbody>
                        </table>
                        <p id="loading-message">در حال بارگذاری کلاس‌ها...</p>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modal for adding/editing classes -->
    <div id="class-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">افزودن کلاس جدید</h2>
            <form id="class-form">
                <input type="hidden" id="class-id">
                <div class="form-group">
                    <label for="class-name">نام کلاس:</label>
                    <input type="text" id="class-name" required placeholder="مثال: دهم تجربی - کلاس A">
                </div>
                <div class="form-group">
                    <label for="class-grade">پایه تحصیلی:</label>
                    <input type="text" id="class-grade" required placeholder="مثال: دهم">
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">ذخیره</button>
                    <button type="button" id="cancel-btn" class="btn btn-secondary">انصراف</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- NEW: Modal for Managing Students in a Class -->
    <div id="manage-students-modal" class="modal">
        <div class="modal-content large">
            <h2>مدیریت دانش‌آموزان کلاس: <span id="modal-class-name-display"></span></h2>
            <input type="hidden" id="modal-class-id">

            <!-- Section for unassigned students -->
            <div class="add-user-section">
                <h4>افزودن دانش‌آموزان بدون کلاس</h4>
                <div class="table-wrapper" id="unassigned-students-wrapper">
                    <table id="unassigned-students-table">
                        <thead>
                            <tr>
                                <th><input type="checkbox" id="select-all-checkbox"></th>
                                <th>نام</th>
                                <th>ایمیل</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                    <p id="unassigned-loading">در حال بارگذاری...</p>
                </div>
                <div class="modal-actions" style="justify-content: flex-start; margin-top: 1rem;">
                    <button id="add-selected-students-btn" class="btn btn-primary">افزودن انتخاب شده‌ها</button>
                </div>
            </div>

            <hr style="margin: 2rem 0;">

            <!-- Section for assigned students -->
            <div>
                <h4>دانش‌آموزان فعلی کلاس</h4>
                <div class="table-wrapper" id="assigned-students-wrapper">
                    <table id="assigned-students-table">
                        <thead>
                            <tr>
                                <th>نام</th>
                                <th>ایمیل</th>
                                <th>عملیات</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                    <p id="assigned-loading">در حال بارگذاری...</p>
                </div>
            </div>

            <div class="modal-actions" style="margin-top: 2rem;">
                <button type="button" id="close-manage-modal-btn" class="btn btn-secondary">بستن</button>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth-check.js"></script>
    <script src="js/classes.js"></script>
</body>
</html>
