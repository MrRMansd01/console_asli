<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طراحی سوالات آزمون</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <style>
        .question-card { border: 1px solid var(--color-border); padding: 1.5rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; background-color: var(--color-surface-2); }
        .question-image, .option-image { max-width: 100%; border-radius: var(--radius-sm); margin-top: 1rem; }
        .option-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .option-group input[type="text"] { flex-grow: 1; }
        .option-group .btn-secondary { flex-shrink: 0; }
        #image-preview-container, .option-preview-container { margin-top: 1rem; }
        #image-preview, .option-preview { max-width: 150px; border-radius: var(--radius-sm); display: none; margin-left: 10px; }
    </style>
</head>
<body>
    <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="منو">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div id="app-layout" class="app-layout">
        <aside id="app-sidebar" class="sidebar-shell"></aside>
        <main class="page-shell">
            <div class="page-shell-inner">
                <header class="page-header">
                    <h1 id="exam-title-header" class="page-title">طراحی سوالات برای: </h1>
                </header>

                <section class="panel">
                    <div id="questions-list">
                        <p id="loading-questions">در حال بارگذاری سوالات...</p>
                    </div>
                    <div class="toolbar">
                        <button id="add-question-btn" class="btn btn-primary"><i class="fas fa-plus"></i> افزودن سوال جدید</button>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modal for adding/editing questions -->
    <div id="question-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">سوال جدید</h2>
            <form id="question-form">
                <input type="hidden" id="question-id">
                <div class="form-group">
                    <label for="question-text">متن سوال:</label>
                    <textarea id="question-text" rows="3" required></textarea>
                </div>

                <div class="form-group">
                    <label>عکس سوال (اختیاری):</label>
                    <input type="file" id="question-image-upload" accept="image/*" style="display: none;">
                    <button type="button" id="upload-image-btn" class="btn btn-secondary">انتخاب عکس</button>
                    <div id="image-preview-container">
                        <img id="image-preview" src="" alt="پیش‌نمایش عکس">
                    </div>
                </div>

                <div class="form-group">
                    <label>گزینه‌ها:</label>
                    <!-- Option A -->
                    <div class="option-group">
                        <span>الف)</span><input type="text" id="option-a-text" placeholder="متن گزینه الف" required>
                        <input type="file" class="option-image-upload" id="option-a-image-upload" accept="image/*" style="display:none;" data-option="A">
                        <button type="button" class="btn btn-secondary upload-option-image-btn" data-option="A">عکس</button>
                    </div>
                     <div class="option-preview-container" id="option-a-preview-container"></div>
                    <!-- Option B -->
                    <div class="option-group">
                        <span>ب)</span><input type="text" id="option-b-text" placeholder="متن گزینه ب" required>
                        <input type="file" class="option-image-upload" id="option-b-image-upload" accept="image/*" style="display:none;" data-option="B">
                        <button type="button" class="btn btn-secondary upload-option-image-btn" data-option="B">عکس</button>
                    </div>
                     <div class="option-preview-container" id="option-b-preview-container"></div>
                    <!-- Option C -->
                    <div class="option-group">
                        <span>ج)</span><input type="text" id="option-c-text" placeholder="متن گزینه ج" required>
                        <input type="file" class="option-image-upload" id="option-c-image-upload" accept="image/*" style="display:none;" data-option="C">
                        <button type="button" class="btn btn-secondary upload-option-image-btn" data-option="C">عکس</button>
                    </div>
                     <div class="option-preview-container" id="option-c-preview-container"></div>
                    <!-- Option D -->
                    <div class="option-group">
                        <span>د)</span><input type="text" id="option-d-text" placeholder="متن گزینه د" required>
                        <input type="file" class="option-image-upload" id="option-d-image-upload" accept="image/*" style="display:none;" data-option="D">
                        <button type="button" class="btn btn-secondary upload-option-image-btn" data-option="D">عکس</button>
                    </div>
                    <div class="option-preview-container" id="option-d-preview-container"></div>
                </div>

                <div class="form-group">
                    <label for="correct-option">گزینه صحیح:</label>
                    <select id="correct-option" required>
                        <option value="A">الف</option>
                        <option value="B">ب</option>
                        <option value="C">ج</option>
                        <option value="D">د</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">ذخیره سوال</button>
                    <button type="button" id="cancel-btn" class="btn btn-secondary">انصراف</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth-check.js"></script>
    <script src="js/create-exam.js"></script>
</body>
</html>
