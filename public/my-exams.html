<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون‌های من</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="منو">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div id="app-layout" class="app-layout">
        <aside id="app-sidebar" class="sidebar-shell"></aside>
        <main class="page-shell">
            <div class="page-shell-inner">
                <header class="page-header">
                    <h1 class="page-title">آزمون‌های من</h1>
                </header>

                <section class="panel">
                    <div class="table-container">
                        <table id="exams-table">
                            <thead>
                                <tr>
                                    <th>نام آزمون</th>
                                    <th>درس</th>
                                    <th>مدت زمان (دقیقه)</th>
                                    <th>تاریخ آزمون</th>
                                    <th>عملیات</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Exam rows will be dynamically inserted here -->
                            </tbody>
                        </table>
                        <p id="loading-message">در حال بارگذاری لیست آزمون‌ها...</p>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth-check.js"></script>
    <script src="js/my-exams.js"></script>
</body>
</html>
