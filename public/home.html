<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد - کنسول پایه</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
    <style>
        .subscription-info {
            font-size: 0.9rem;
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--color-primary);
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="منو">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div id="app-layout" class="app-layout">
        <aside id="app-sidebar" class="sidebar-shell"></aside>
        <main class="page-shell">
            <div class="page-shell-inner">
                <header class="page-header">
                    <h1 id="page-title" class="page-title">داشبورد</h1>
                    <div class="page-header-actions">
                        <span id="subscription-display" class="subscription-info" style="display:none;"></span>
                    </div>
                </header>

                <section id="page-dashboard" class="page page-active" aria-labelledby="page-title">
                    <div class="stats-row" id="stats-row">
                        <div class="stat-card">
                            <div class="stat-label">کل وظایف</div>
                            <div class="stat-value" id="stat-total-tasks">۰</div>
                            <div class="stat-meta">
                                <i class="fa-solid fa-list-check"></i>
                                <span>در همه پروژه‌ها</span>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">آزمون‌های در پیش</div>
                            <div class="stat-value" id="stat-pending-exams">۰</div>
                            <div class="stat-meta">
                                <i class="fa-solid fa-file-pen"></i>
                                <span>در ۷ روز آینده</span>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">میانگین نمره</div>
                            <div class="stat-value" id="stat-average-score">—</div>
                            <div class="stat-meta">
                                <i class="fa-solid fa-graduation-cap"></i>
                                <span>آخرین کارنامه</span>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">روزهای باقی‌مانده اشتراک</div>
                            <div class="stat-value" id="stat-subscription-days">—</div>
                            <div class="stat-meta">
                                <i class="fa-solid fa-id-card-clip"></i>
                                <span>وضعیت مدرسه</span>
                            </div>
                        </div>
                    </div>

                    <div class="dashboard-grid">
                        <!-- Next 48 hours timeline -->
                        <section class="panel timeline-panel" aria-label="رویدادهای ۴۸ ساعت آینده">
                            <header class="panel-header">
                                <h2>۴۸ ساعت آینده</h2>
                            </header>
                            <div id="next-48h-list" class="timeline-list">
                                <div class="empty-state">در حال بارگذاری...</div>
                            </div>
                        </section>

                        <!-- Jalali calendar -->
                        <section class="panel calendar-panel" aria-label="تقویم وظایف">
                            <header class="panel-header">
                                <h2>تقویم جلالی</h2>
                            </header>
                            <div id="dashboard-calendar" class="calendar-root">
                                <div class="loading-spinner"></div>
                            </div>
                        </section>
                    </div>

                    <!-- Role-based intelligent widget -->
                    <section id="role-widget-container" class="role-widget-container" aria-label="ویجت هوشمند">
                        <!-- Filled dynamically -->
                    </section>
                </section>
            </div>
        </main>
    </div>

    <!-- Quick add modal -->
    <div id="quick-add-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="quick-add-title">
        <div class="modal-content">
            <header class="modal-header">
                <h2 id="quick-add-title">افزودن وظیفه / یادداشت</h2>
                <button id="quick-add-close" class="icon-btn" aria-label="بستن">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </header>
            <form id="quick-add-form" class="modal-form">
                <label class="form-field">
                    <span>عنوان</span>
                    <input type="text" id="quick-add-title-input" required>
                </label>
                <label class="form-field">
                    <span>توضیحات</span>
                    <textarea id="quick-add-description-input" rows="3"></textarea>
                </label>
                <label class="form-field">
                    <span>تاریخ و زمان سررسید</span>
                    <input type="datetime-local" id="quick-add-due-input">
                </label>
                <label class="form-field">
                    <span>نوع</span>
                    <select id="quick-add-type-input">
                        <option value="task">وظیفه</option>
                        <option value="exam">آزمون</option>
                        <option value="note">یادداشت</option>
                    </select>
                </label>
                <footer class="modal-footer">
                    <button type="button" id="quick-add-cancel" class="btn-secondary">انصراف</button>
                    <button type="submit" class="btn-primary">ثبت</button>
                </footer>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales/fa.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/jalali@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="js/auth-check.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
